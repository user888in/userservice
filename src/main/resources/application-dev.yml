spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/userservice_db
    driver-class-name: org.postgresql.Driver
    username: devuser
    password: devpass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.devops: DEBUG