name: CI Pipeline

# ─────────────────────────────────────────
# WHEN does this pipeline run?
# ─────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

# Cancel previous runs on same branch if new push comes in
# Saves CI minutes — no point finishing an outdated build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────
# ENVIRONMENT VARIABLES (available to all jobs)
# ─────────────────────────────────────────
env:
  JAVA_VERSION: '21'
  IMAGE_NAME: userservice
  REGISTRY: ghcr.io
  IMAGE_FULL: ghcr.io/${{ github.repository_owner }}/userservice

jobs:

  # ═══════════════════════════════════════
  # JOB 1: BUILD & TEST
  # ═══════════════════════════════════════
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # 2. Set up Java
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.2.2
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'           # same JDK as our Docker image
          cache: 'maven'                    # cache ~/.m2 between runs → faster CI

      # 3. Run tests
      - name: Run tests
        run: ./mvnw test -B
        env:
          SPRING_PROFILES_ACTIVE: test      # uses H2, not Postgres

      # 4. Build the JAR (skip tests — already ran above)
      - name: Build JAR
        run: ./mvnw clean package -DskipTests -B

      # 5. Upload test results (visible in GitHub UI)
      - name: Upload test results
        uses: actions/upload-artifact@v4.3.3
        if: always()                        # upload even if tests fail
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      # 6. Upload JAR as artifact (used by docker job)
      - name: Upload JAR
        uses: actions/upload-artifact@v4.3.3
        with:
          name: app-jar
          path: target/userservice-0.0.1-SNAPSHOT.jar
          retention-days: 1

  # ═══════════════════════════════════════
  # JOB 2: CODE QUALITY
  # ═══════════════════════════════════════
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test       # only runs if build-and-test passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.2.2
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # Check code style — fails build if violations found
      - name: Run Checkstyle
        run: ./mvnw checkstyle:check -B

      # Detect common bugs (null pointers, resource leaks etc.)
      - name: Run SpotBugs
        run: ./mvnw spotbugs:check -B

  # ═══════════════════════════════════════
  # JOB 3: DOCKER BUILD & PUSH
  # Only runs on main and develop branches
  # NOT on feature branches (no point pushing PR images)
  # ═══════════════════════════════════════
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write           # needed to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Extract metadata for Docker tags and labels
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.IMAGE_FULL }}
          tags: |
            # develop branch → :develop-<short-sha>
            type=ref,event=branch
            # main branch → version tag from pom.xml
            type=semver,pattern={{version}}
            # always tag with full SHA for traceability
            type=sha,prefix={{branch}}-
            # latest tag only on main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Set up QEMU for multi-platform builds (arm64 + amd64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.2.0

      # Set up Docker Buildx (required for multi-platform + cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.1

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-provided by GitHub

      # Build and push with full caching
      - name: Build and push Docker image
        uses: docker/build-push-action@v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64   # works on AWS, Mac M1, etc.
          cache-from: type=gha                 # GitHub Actions cache
          cache-to: type=gha,mode=max

      # Print the image digest for traceability
      - name: Image digest
        run: echo "Image pushed → ${{ steps.meta.outputs.tags }}"

  # ═══════════════════════════════════════
  # JOB 4: SECURITY SCAN
  # Scans the Docker image for vulnerabilities
  # ═══════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      security-events: write    # needed to upload scan results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trivy scans for CVEs in your Docker image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_FULL }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # Upload results to GitHub Security tab
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'